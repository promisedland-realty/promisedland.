<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Promised Land</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1628;--blue:#1d4ed8;--green:#16a34a;--red:#dc2626;
  --gold:#f59e0b;--gray:#f1f5f9;--gray2:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f8fafc;color:var(--text);}
a{text-decoration:none;color:inherit;}

/* ── LOGIN ── */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1628 0%,#1e3a8a 60%,#1d4ed8 100%);
}
.login-box{
  background:#fff;border-radius:20px;padding:44px 40px;
  width:380px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.35);
}
.login-logo{font-size:2.8rem;margin-bottom:10px;}
.login-box h2{font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:4px;color:var(--navy);}
.login-box p{color:var(--muted);font-size:0.87rem;margin-bottom:28px;}
.login-field{
  width:100%;border:1.5px solid var(--gray2);border-radius:10px;
  padding:12px 14px;font-size:0.95rem;margin-bottom:12px;
  outline:none;transition:border 0.2s;font-family:'DM Sans',sans-serif;
}
.login-field:focus{border-color:#3b82f6;}
.login-btn{
  width:100%;background:linear-gradient(135deg,var(--navy),var(--blue));
  color:#fff;border:none;padding:13px;border-radius:10px;
  font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.2s;
  font-family:'DM Sans',sans-serif;
}
.login-btn:hover{opacity:0.9;transform:translateY(-1px);}
.login-err{
  background:#fee2e2;color:#991b1b;border-radius:8px;
  padding:10px;font-size:0.84rem;margin-top:10px;display:none;
}

/* ── LAYOUT ── */
#adminApp{display:none;min-height:100vh;}
.admin-header{
  background:var(--navy);padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.3);
}
.admin-logo{font-family:'Playfair Display',serif;color:#fff;font-size:1.15rem;}
.admin-logo span{color:var(--gold);}
.header-right{display:flex;align-items:center;gap:14px;}
.user-pill{
  background:rgba(255,255,255,0.08);color:#cbd5e1;
  border:1px solid rgba(255,255,255,0.12);padding:7px 14px;
  border-radius:50px;font-size:0.82rem;
}
.logout-btn{
  background:rgba(220,38,38,0.15);color:#fca5a5;
  border:1px solid rgba(220,38,38,0.3);padding:7px 14px;
  border-radius:50px;font-size:0.82rem;cursor:pointer;transition:all 0.2s;
}
.logout-btn:hover{background:rgba(220,38,38,0.3);color:#fff;}

/* ── STATS ── */
.stats-bar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px;padding:24px 28px 0;
}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:20px 18px;
  box-shadow:var(--shadow);text-align:center;border-top:3px solid transparent;
}
.stat-card.s-total   {border-color:var(--blue);}
.stat-card.s-pending {border-color:var(--gold);}
.stat-card.s-approved{border-color:var(--green);}
.stat-card.s-rejected{border-color:var(--red);}
.stat-num{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;line-height:1;}
.s-total   .stat-num{color:var(--blue);}
.s-pending .stat-num{color:var(--gold);}
.s-approved .stat-num{color:var(--green);}
.s-rejected .stat-num{color:var(--red);}
.stat-lbl{font-size:0.78rem;color:var(--muted);margin-top:6px;font-weight:500;}

/* ── TAB BAR ── */
.tab-bar{
  display:flex;gap:0;padding:0 28px;
  background:#fff;border-bottom:1px solid var(--gray2);
  margin-top:20px;overflow-x:auto;
}
.tab{
  padding:15px 22px;font-size:0.88rem;font-weight:600;
  cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;
  transition:all 0.2s;white-space:nowrap;
}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab:hover:not(.active){color:var(--text);}

/* ── FILTERS ── */
.filter-bar{
  display:flex;gap:10px;flex-wrap:wrap;
  padding:20px 28px 0;
}
.filter-bar select,.filter-bar input{
  border:1.5px solid var(--gray2);border-radius:9px;
  padding:9px 14px;font-size:0.87rem;outline:none;
  background:#fff;font-family:'DM Sans',sans-serif;
  transition:border 0.2s;
}
.filter-bar select:focus,.filter-bar input:focus{border-color:#3b82f6;}
.filter-bar input{min-width:220px;}
.refresh-btn{
  background:var(--blue);color:#fff;border:none;
  padding:9px 18px;border-radius:9px;font-size:0.87rem;
  font-weight:600;cursor:pointer;transition:all 0.2s;
}
.refresh-btn:hover{opacity:0.88;}

/* ── PROP LIST ── */
.content{padding:20px 28px 60px;}
.prop-list{display:flex;flex-direction:column;gap:14px;margin-top:20px;}
.prop-item{
  background:#fff;border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);display:flex;gap:18px;
  align-items:flex-start;border-left:4px solid transparent;
  transition:box-shadow 0.2s;
}
.prop-item:hover{box-shadow:0 8px 32px rgba(0,0,0,0.12);}
.prop-item.status-pending {border-left-color:var(--gold);}
.prop-item.status-approved{border-left-color:var(--green);}
.prop-item.status-rejected{border-left-color:var(--red);}
.prop-thumb{
  width:88px;height:76px;border-radius:10px;flex-shrink:0;
  background:var(--gray);display:flex;align-items:center;
  justify-content:center;font-size:2.2rem;overflow:hidden;
}
.prop-thumb img{width:100%;height:100%;object-fit:cover;}
.prop-info{flex:1;min-width:0;}
.prop-info h3{
  font-size:0.97rem;font-weight:600;margin-bottom:6px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.status-badge{
  display:inline-block;padding:3px 10px;border-radius:50px;
  font-size:0.7rem;font-weight:700;letter-spacing:0.05em;
}
.badge-pending {background:#fef9c3;color:#92400e;}
.badge-approved{background:#dcfce7;color:#15803d;}
.badge-rejected{background:#fee2e2;color:#991b1b;}
.prop-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.meta-tag{
  background:var(--gray);padding:3px 10px;border-radius:50px;
  font-size:0.74rem;color:var(--muted);
}
.prop-desc{
  font-size:0.83rem;color:var(--muted);line-height:1.55;
  margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.prop-contact{font-size:0.83rem;color:var(--text);margin-bottom:12px;}
.prop-contact a{color:var(--blue);}
.action-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn-approve,.btn-reject,.btn-pending,.btn-delete{
  padding:8px 14px;border:none;border-radius:8px;
  font-weight:600;font-size:0.82rem;cursor:pointer;
  transition:all 0.2s;font-family:'DM Sans',sans-serif;
}
.btn-approve{background:var(--green);color:#fff;}
.btn-approve:hover{background:#15803d;}
.btn-reject {background:var(--red);color:#fff;}
.btn-reject:hover{background:#b91c1c;}
.btn-pending{background:var(--gold);color:#fff;}
.btn-pending:hover{background:#d97706;}
.btn-delete {background:var(--gray);color:var(--text);}
.btn-delete:hover{background:var(--gray2);}

/* ── EMPTY / LOADING ── */
.empty{text-align:center;padding:70px 20px;color:var(--muted);}
.empty-icon{font-size:3.5rem;margin-bottom:14px;}
.loading{text-align:center;padding:50px;color:var(--muted);}
.spinner{
  width:36px;height:36px;border:3px solid var(--gray2);
  border-top-color:var(--blue);border-radius:50%;
  animation:spin 0.8s linear infinite;margin:0 auto 14px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:12px 28px;
  border-radius:50px;font-size:0.88rem;z-index:9999;
  opacity:0;transition:opacity 0.3s;pointer-events:none;
  white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
#toast.show{opacity:1;}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .prop-item{flex-direction:column;}
  .prop-thumb{width:100%;height:150px;}
  .stats-bar{grid-template-columns:1fr 1fr;}
  .admin-header{padding:12px 16px;}
  .content,.filter-bar,.tab-bar{padding-left:16px;padding-right:16px;}
}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🏡</div>
    <h2>Promised Land</h2>
    <p>Admin Panel · Sign in to manage listings</p>
    <input class="login-field" type="email"    id="adminEmail" placeholder="Admin email" value="rera.promizedland@gmail.com">
    <input class="login-field" type="password" id="adminPass"  placeholder="Password"
           onkeydown="if(event.key==='Enter') login()">
    <button class="login-btn" onclick="login()">Sign In →</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ── ADMIN APP ── -->
<div id="adminApp">

  <header class="admin-header">
    <div class="admin-logo">🏡 Promised Land <span>Admin</span></div>
    <div class="header-right">
      <div class="user-pill" id="userPill">–</div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card s-total">
      <div class="stat-num" id="sTotal">–</div>
      <div class="stat-lbl">Total Listings</div>
    </div>
    <div class="stat-card s-pending">
      <div class="stat-num" id="sPending">–</div>
      <div class="stat-lbl">⏳ Pending</div>
    </div>
    <div class="stat-card s-approved">
      <div class="stat-num" id="sApproved">–</div>
      <div class="stat-lbl">✅ Live</div>
    </div>
    <div class="stat-card s-rejected">
      <div class="stat-num" id="sRejected">–</div>
      <div class="stat-lbl">❌ Rejected</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('pending',this)"  >⏳ Pending</div>
    <div class="tab"        onclick="switchTab('approved',this)" >✅ Approved</div>
    <div class="tab"        onclick="switchTab('rejected',this)" >❌ Rejected</div>
    <div class="tab"        onclick="switchTab('all',this)"      >📋 All</div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <select id="fDistrict" onchange="applyFilters()">
      <option value="">All Districts</option>
      <option>Ariyalur</option><option>Chengalpattu</option><option>Chennai</option>
      <option>Coimbatore</option><option>Cuddalore</option><option>Dharmapuri</option>
      <option>Dindigul</option><option>Erode</option><option>Hosur</option>
      <option>Kanchipuram</option><option>Kanyakumari</option><option>Karur</option>
      <option>Madurai</option><option>Nagapattinam</option><option>Namakkal</option>
      <option>Pudukkottai</option><option>Ramanathapuram</option><option>Salem</option>
      <option>Sivaganga</option><option>Thanjavur</option><option>Thoothukudi</option>
      <option>Tiruchirappalli</option><option>Tirunelveli</option><option>Tiruppur</option>
      <option>Vellore</option><option>Virudhunagar</option>
    </select>
    <select id="fType" onchange="applyFilters()">
      <option value="">All Types</option>
      <option>Plot</option><option>Villa</option><option>Apartment</option>
      <option>Commercial</option><option>Warehouse</option><option>Hotel</option>
      <option>Agriculture</option>
    </select>
    <input type="text" id="fSearch" placeholder="🔍  Search title, owner, area..."
           oninput="applyFilters()">
    <button class="refresh-btn" onclick="loadAll()">🔄 Refresh</button>
  </div>

  <div class="content">
    <div class="prop-list" id="propList">
      <div class="loading">
        <div class="spinner"></div>
        Loading listings...
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- ── SUPABASE SCRIPT ── -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// ── PASTE YOUR SUPABASE CONFIG HERE (same as app.js) ─────────────────────────
const SUPABASE_URL  = "https://YOUR_PROJECT_ID.supabase.co";
const SUPABASE_ANON = "YOUR_ANON_PUBLIC_KEY";
// ─────────────────────────────────────────────────────────────────────────────

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── STATE ─────────────────────────────────────────────────────────────────────
let allListings  = [];
let currentTab   = "pending";
let currentUser  = null;

// ── AUTH ──────────────────────────────────────────────────────────────────────
supabase.auth.onAuthStateChange((_event, session) => {
  if (session?.user) {
    currentUser = session.user;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminApp").style.display    = "block";
    document.getElementById("userPill").textContent      = session.user.email;
    loadAll();
  } else {
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("adminApp").style.display    = "none";
    currentUser = null;
  }
});

window.login = async () => {
  const email = document.getElementById("adminEmail").value.trim();
  const pass  = document.getElementById("adminPass").value;
  const errEl = document.getElementById("loginErr");
  errEl.style.display = "none";
  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  if (error) {
    errEl.textContent    = "❌ " + error.message;
    errEl.style.display  = "block";
  }
};

window.logout = async () => {
  await supabase.auth.signOut();
};

// ── LOAD ──────────────────────────────────────────────────────────────────────
window.loadAll = async () => {
  document.getElementById("propList").innerHTML =
    '<div class="loading"><div class="spinner"></div>Loading listings...</div>';
  const { data, error } = await supabase
    .from("properties")
    .select("*")
    .order("created_at", { ascending: false });
  if (error) {
    document.getElementById("propList").innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><p>Error: ${error.message}</p></div>`;
    return;
  }
  allListings = data || [];
  updateStats();
  applyFilters();
};

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById("sTotal").textContent    = allListings.length;
  document.getElementById("sPending").textContent  = allListings.filter(p=>p.status==="pending").length;
  document.getElementById("sApproved").textContent = allListings.filter(p=>p.status==="approved").length;
  document.getElementById("sRejected").textContent = allListings.filter(p=>p.status==="rejected").length;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(list) {
  const el = document.getElementById("propList");
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🏚️</div><p>No listings found for this filter.</p></div>';
    return;
  }
  el.innerHTML = list.map(p => `
    <div class="prop-item status-${p.status}" id="row-${p.id}">
      <div class="prop-thumb">
        ${p.photo_url
          ? `<img src="${p.photo_url}" onerror="this.style.display='none'">`
          : icon(p.type)}
      </div>
      <div class="prop-info">
        <h3>
          ${p.title || "Untitled"}
          <span class="status-badge badge-${p.status}">${p.status.toUpperCase()}</span>
        </h3>
        <div class="prop-meta">
          <span class="meta-tag">🏷️ ${p.type||"–"}</span>
          <span class="meta-tag">📍 ${p.district||"–"}</span>
          ${p.area  ? `<span class="meta-tag">📌 ${p.area}</span>`  : ""}
          ${p.size  ? `<span class="meta-tag">📐 ${p.size}</span>`  : ""}
          <span class="meta-tag">💰 ${fmt(p.price)}</span>
        </div>
        <div class="prop-desc">${p.description || "No description."}</div>
        <div class="prop-contact">
          👤 <strong>${p.owner_name||"–"}</strong> &nbsp;|&nbsp;
          📞 <a href="tel:+91${p.phone}">+91 ${p.phone||"–"}</a> &nbsp;|&nbsp;
          🕐 ${fmtDate(p.created_at)}
        </div>
        <div class="action-row">
          ${p.status !== "approved" ? `<button class="btn-approve" onclick="setStatus('${p.id}','approved')">✅ Approve</button>` : ""}
          ${p.status !== "rejected" ? `<button class="btn-reject"  onclick="setStatus('${p.id}','rejected')">❌ Reject</button>`  : ""}
          ${p.status !== "pending"  ? `<button class="btn-pending" onclick="setStatus('${p.id}','pending')">⏳ Reset</button>`    : ""}
          <button class="btn-delete" onclick="deleteListing('${p.id}')">🗑️ Delete</button>
        </div>
      </div>
    </div>`).join("");
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
window.setStatus = async (id, status) => {
  const { error } = await supabase.from("properties").update({ status }).eq("id", id);
  if (error) { toast("❌ Error: "+error.message); return; }
  const idx = allListings.findIndex(p=>p.id===id);
  if (idx>-1) allListings[idx].status = status;
  updateStats();
  applyFilters();
  toast(status==="approved" ? "✅ Listing is now LIVE!" : status==="rejected" ? "❌ Listing rejected." : "⏳ Reset to pending.");
};

window.deleteListing = async (id) => {
  if (!confirm("Permanently delete this listing? This cannot be undone.")) return;
  const { error } = await supabase.from("properties").delete().eq("id", id);
  if (error) { toast("❌ Error: "+error.message); return; }
  allListings = allListings.filter(p=>p.id!==id);
  updateStats();
  applyFilters();
  toast("🗑️ Listing permanently deleted.");
};

// ── FILTERS / TABS ────────────────────────────────────────────────────────────
window.switchTab = (tab, el) => {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  applyFilters();
};

window.applyFilters = () => {
  const district = document.getElementById("fDistrict").value;
  const type     = document.getElementById("fType").value;
  const search   = document.getElementById("fSearch").value.toLowerCase();

  let list = currentTab === "all"
    ? allListings
    : allListings.filter(p=>p.status===currentTab);

  if (district) list = list.filter(p=>p.district===district);
  if (type)     list = list.filter(p=>p.type===type);
  if (search)   list = list.filter(p=>
    (p.title||"").toLowerCase().includes(search)     ||
    (p.owner_name||"").toLowerCase().includes(search)||
    (p.area||"").toLowerCase().includes(search)      ||
    (p.phone||"").includes(search));

  render(list);
};

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmt(n) {
  if (!n) return "On Request";
  if (n>=10000000) return `₹${(n/10000000).toFixed(2)} Cr`;
  if (n>=100000)   return `₹${(n/100000).toFixed(1)} L`;
  return `₹${n.toLocaleString("en-IN")}`;
}
function fmtDate(d) {
  if (!d) return "–";
  return new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function icon(t) {
  return {Plot:"🌾",Villa:"🏠",Apartment:"🏢",Commercial:"🏬",Warehouse:"🏭",Hotel:"🍽️",Agriculture:"🌿"}[t]||"🏠";
}
let _tt;
function toast(msg) {
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(_tt);
  _tt=setTimeout(()=>el.classList.remove("show"),3200);
}
</script>
</body>
</html>
